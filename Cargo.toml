[package]
name = "declarch"
version = "0.1.0"
edition = "2024"

[dependencies]
# CLI parsing
clap = { version = "4.4", features = ["derive"] }

# KDL parsing
kdl = "4.1"

# JSON state management
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Home directory detection
dirs = "5.0"

# Colored output
colored = "2.1"

# Date/time
chrono = "0.4"
